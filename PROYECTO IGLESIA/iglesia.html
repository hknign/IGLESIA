<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iglesia Nacional - Detalle Iglesia</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">Iglesia Evangélica Pentecostal de la Comunión de los Santos</a>
    </div>
  </nav>

  <section class="container my-5">
    <h2 id="tituloIglesia" class="text-primary fw-bold"></h2>
    <p id="descripcionIglesia" class="lead"></p>
    <img id="imagenIglesia" src="assets/img/iglesia1.jpg" class="img-fluid rounded shadow my-3">
  </section>

  <script>
    // Simulación de base de datos local
    const dataIglesias = {
      1: { titulo: "IEPCS Valdivia", descripcion: "BREVE DESCRIPCIÓN DEL AÑO DE SU CREACIÓN", img: "assets/img/iglesia1.jpg" },
      2: { titulo: "IEPCS Osorno", descripcion: "BREVE DESCRIPCIÓN DEL AÑO DE SU CREACIÓN", img: "assets/img/iglesia2.jpg" },
      3: { titulo: "IEPCS Los muermos", descripcion: "BREVE DESCRIPCIÓN DEL AÑO DE SU CREACIÓN", img: "assets/img/iglesia3.jpg" }
    };

    // Obtener ID de la URL
    const params = new URLSearchParams(window.location.search);
    const id = params.get("id");

    if (dataIglesias[id]) {
      document.getElementById("tituloIglesia").textContent = dataIglesias[id].titulo;
      document.getElementById("descripcionIglesia").textContent = dataIglesias[id].descripcion;
      document.getElementById("imagenIglesia").src = dataIglesias[id].img;
    }
  </script>
</body>
</html>
